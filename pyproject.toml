[project]
name = "gamm"
version = "0.1.0"
description = "Google Ads MCP Manager: a gateway that gives AI agents audited, human-approved write access to Google Ads."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10,<5",
    "google-ads>=33,<34",
    "webauthn>=2.5,<3",
    "jinja2>=3.1",
]

[project.scripts]
gamm = "gamm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
